org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Full R8 mode: stronger shrinking/optimization (Google Play R8 advice).
android.enableR8.fullMode=true
# Flutter 3.41.2's gradle plugin still uses the pre-AGP9 DSL. Opt out of
# AGP 9's new-DSL-only mode until Flutter ships full AGP 9 support.
# https://docs.flutter.dev/release/breaking-changes/migrate-to-agp-9
android.newDsl=false
# AGP 9 built-in Kotlin collides with plugins (image_picker etc.) that still
# apply org.jetbrains.kotlin.android ("extension already registered").
android.builtInKotlin=false
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-20.jdk/Contents/Home
